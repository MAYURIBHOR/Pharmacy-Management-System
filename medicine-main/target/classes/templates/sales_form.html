<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pageTitle}">New Sale</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { background-color: #dbeafb; }
        .container { margin-top: 20px; }
        /* Style the input cells to be clean */
        .table-input-cell { padding: 0.25rem 0.5rem; }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="mb-4" th:text="${pageTitle}">Process New Sale</h1>

        <div class="card">
            <div class="card-header bg-success text-white">
                Transaction Details
            </div>
            <div class="card-body">
                
                <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}">Error placeholder</div>
                
                <form th:action="@{/sales/save}" method="post" th:object="${sale}">
                
                    <input type="hidden" th:field="*{id}" />

                    <div class="form-group">
                        <label for="customer">Customer</label>
                        <select th:field="*{customer}" class="form-control" id="customer">
                            <option th:value="null">-- Walk-in Customer --</option>
                            <option th:value="0">-- Online Customer --</option>
                            <option th:each="cust : ${customers}" 
                                    th:value="${cust.id}" 
                                    th:text="${cust.name}"></option>
                        </select>
                        <small class="form-text text-muted">Select the customer or process as walk-in.</small>
                    </div>

                    <hr/>
                    
                    <h3>Items</h3>
                    
                    <table class="table table-bordered">
                        <thead class="thead-light">
                            <tr><th>Product Name/ID</th><th>Quantity</th><th>Unit Price ($)</th></tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="table-input-cell">
                                    <input type="text" name="productName1" value="" class="form-control form-control-sm" placeholder="Enter Product Name/ID"/>
                                </td>
                                
                                <td class="table-input-cell">
                                    <input type="number" name="quantity1" value="1" min="1" class="form-control form-control-sm" placeholder="Qty"/>
                                </td>
                                
                                <td class="table-input-cell">
                                    <input type="number" name="price1" value="0.00" step="0.01" min="0" class="form-control form-control-sm" placeholder="Price"/>
                                </td>
                            </tr>
                            </tbody>
                    </table>

                    <div class="form-group text-right">
                        <label>Total Amount:</label>
                        <input type="number" 
                               th:field="*{totalAmount}" 
                               class="form-control d-inline w-25" 
                               step="0.01"/> 
                    </div>
                    
                    <div class="form-group">
                        <label for="paymentType">Payment Type</label>
                        <select th:field="*{paymentType}" class="form-control" id="paymentType" required>
                            <option value="Cash">Cash</option>
                            <option value="Card">Card</option>
                            <option value="UPI">UPI</option>
                        </select>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-success btn-lg">Complete Sale</button>
                        <a th:href="@{/sales}" class="btn btn-secondary ml-2">Cancel</a>
                    </div>
                </form>

            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
