<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sales & Billing</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { background-color: #e2c8c8; }
        .container { margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="mb-4">Sales & Billing Dashboard</h1>

        <div class="row mb-4">
            <div class="col-md-4">
                <a th:href="@{/sales/new}" class="btn btn-success btn-block">Start New Sale</a>
            </div>
            <div class="col-md-4">
                <a th:href="@{/sales/history}" class="btn btn-info btn-block">View Sales History</a>
            </div>
            <div class="col-md-4">
                <a th:href="@{/dashboard}" class="btn btn-secondary btn-block">Back to Dashboard</a>
            </div>
        </div>
        
        <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>


        <div class="card">
            <div class="card-header">
                Recent Transactions
            </div>
            <div class="card-body">
                
                <div th:if="${sales == null or sales.isEmpty()}" class="alert alert-info">
                    No recent transactions found. Click "Start New Sale" to begin.
                </div>
                
                <div th:unless="${sales == null or sales.isEmpty()}">
                    <table class="table table-striped table-hover table-bordered">
                        <thead class="thead-dark">
                            <tr>
                                <th>Invoice ID</th>
                                <th>Date</th>
                                <th>Customer</th>
                                <th>Total ($)</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="sale : ${sales}">
                                <td th:text="${sale.id}">1</td>
                                <td th:text="${#dates.format(sale.saleDate, 'yyyy-MM-dd')}">2025-10-01</td>
                                <td th:text="${sale.customer != null ? sale.customer.name : 'Walk-in'}">Walk-in</td> 
                                <td th:text="${#numbers.formatDecimal(sale.totalAmount, 0, 'COMMA', 2, 'POINT')}">50.00</td>
                                <td>
                                    <a th:href="@{'/sales/view/' + ${sale.id}}" class="btn btn-sm btn-primary">View</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
